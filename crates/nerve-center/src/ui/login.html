<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
  <form class="login-form" method="post" action="/login">
    <div class="login-head">
      <img class="login-mark" src="/icon.svg" alt="" width="64" height="64">
      <h1>Nerve</h1>
      <p>One center for all your machines.</p>
    </div>
    <input class="login-input" type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus required{{INVALID}}>
    {{ERROR}}
    <button class="login-submit" type="submit">Sign in</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
