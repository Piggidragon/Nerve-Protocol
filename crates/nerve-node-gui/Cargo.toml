[package]
name = "nerve-node-gui"
description = "The Nerve node with its desktop app: the node, its CLI and a window that drives the CLI."
version.workspace = true
edition.workspace = true
repository.workspace = true
# Slint's own minimum.
rust-version = "1.92"
publish = false

[[bin]]
name = "nerve-node-gui"
path = "src/main.rs"

[dependencies]
nerve-node.workspace = true
slint.workspace = true
serde_json.workspace = true

# Which list an audit button puts a sudo command on, and whether a target
# was cut: the node's own rules.
nerve-policy.workspace = true

[target.'cfg(windows)'.dependencies]
# The CLI takes the console of the terminal it was started from
# (src/console.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
nerve-conformance = { path = "../nerve-conformance" }
# Writes the screenshots of tests/shots.rs; in the lock through Slint.
png = "0.18"
