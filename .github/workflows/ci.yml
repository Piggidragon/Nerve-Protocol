# The checks on every pull request, and on main after a merge: fmt, clippy and
# the whole test suite, on Linux and on Windows, and the tests that differ on
# musl, the C library of the released Linux programs. The release workflow runs the
# same fmt, clippy and tests on Linux before it builds anything
# (docs/dev/releasing.md), but nothing there runs the Windows tests: its
# Windows job only builds.
#
# The Windows job runs the same `cargo test --workspace`, so the tests that are
# compiled only on Windows run there: grants, the integrity level, the service
# steps, the job object, the AppContainer, Windows paths and rules. The tests
# that need something a hosted runner does not give (a service the node is
# installed as, an administrator account, a virtual disk, the system keyring)
# carry `#[ignore = "<reason>"]`, so every run lists them as ignored with the
# reason; they are run by hand on a Windows test machine.
#
# `pull_request` runs the merge of the branch into main, with a read-only token
# and no secrets, also for a pull request from a fork. Nothing here writes to
# the repository, and no secrets are used. The actions are pinned by commit.
#
# The cargo cache is saved by the runs on main as well, because a pull request
# can only read the caches of its own branch and of main: without them every
# new pull request would start cold. A cache is saved once per key (the
# toolchain and Cargo.lock) and only by a run whose job passed, so the first
# green run on main after a lock file change saves it.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request replaces its run that is still going. A push to
# main has a group of its own (its commit), so no run on main waits behind
# another or is replaced by a later one: each commit there gets its result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The toolchain the release is built with (RUST_TOOLCHAIN in release.yml; raise
  # both together), so a pull request is checked the way the release is.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never
  # A CI run never builds twice, so incremental compilation only fills the cache.
  CARGO_INCREMENTAL: "0"
  # Line tables are enough for a backtrace, and the cache and the link step stay
  # small (the Windows PDBs most of all).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A test that fails on a machine nobody can reach says where.
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      # Before the cache, so a badly formatted pull request fails in seconds.
      - run: cargo fmt --check
      # The key holds the lock file and no restore key follows it: a changed
      # lock file builds once from scratch, and the cache never collects the
      # dependencies it once had.
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The whole workspace, with the end-to-end tests that start the real
      # programs (Unix only). `--no-fail-fast` shows every failing test at once.
      - run: cargo test --locked --workspace --no-fail-fast

  # The released Linux programs are static, built against musl
  # (release.yml), and the standard library differs there: it drops O_PATH
  # from `OpenOptions::custom_flags`, as musl's O_ACCMODE holds it. The walk
  # that gives the node's and the center's folders away (install,
  # uninstall) opened sockets, links and FIFOs on musl only, so its tests
  # run on that target as well.
  musl:
    name: Linux musl (folder walk of install and uninstall)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
      - name: A C compiler for musl (ring's C parts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-musl-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Tests
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test --locked --target x86_64-unknown-linux-musl -p nerve-node --lib -- service::tests::chown

  # Linux never compiles the Windows branches, so clippy and the tests must run
  # here too: nerve-node, nerve-sandbox and nerve-policy have Windows-only code
  # and tests, and the Unix-only tests (end-to-end, Landlock) are compiled out.
  windows:
    name: Windows (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # The Windows image sets core.autocrlf=true, so a checkout would write CRLF
      # line endings: include_str! would embed a CRLF page and a test that looks
      # for "\n" in it would fail. The repository is LF everywhere.
      - name: Check out with LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The tests marked `#[ignore = "<reason>"]` stay ignored and are listed
      # as such in the output. The tests below fail on Windows today and are
      # skipped by name, so that this job is green and a new failure shows;
      # remove each skip when its test is fixed:
      # - the_keyring_places_are_the_session_bus_and_the_keyring_folder checks
      #   Unix paths and fails on Windows (issue #96);
      # - the_daemon_logs_its_links_changes_and_failed_calls never sees the
      #   settings change logged on Windows, a run on a Windows test machine
      #   fails the same way (issue #99);
      # - folder_mode_confines_commands_to_their_folders,
      #   windows_folder_grants_follow_the_folders and
      #   an_appcontainer_moves_only_what_it_reads_and_writes fail on the
      #   hosted runner (the first two with "no answer within 15s"). The cause
      #   is not known yet. They pass on the Windows test VM (issue #106);
      # - powershell_runs_in_an_appcontainer,
      #   powershell_changes_to_whole_paths_in_an_appcontainer and
      #   an_appcontainer_keeps_write_and_execute_apart_from_read fail on the
      #   hosted runner (the log shows PowerShell cmdlets "not recognized" in
      #   the container). The cause is not known yet. They pass on the Windows
      #   test VM (issue #105).
      # - a_cancel_ends_a_chain_of_processes_that_hand_over_and_exit is a
      #   timing flake under load: it waits a fixed 4 seconds for hops to
      #   start, and it passes when run alone (issue #107).
      # - a_timeout_ends_a_grandchild_whose_parent_exited fails on the hosted
      #   runner (exec.rs:3095) in a PR run while it passes on main; the same
      #   class as #107 (issue #112).
      # TMP and TEMP point at the runner's temp folder, a long-name path
      # (D:\a\_temp). The default is C:\Users\RUNNER~1\AppData\Local\Temp, and
      # tempfile hands out that 8.3 short form: a test that compares it with the
      # long form the node walks finds no match, and an AppContainer is denied
      # the short-name path of the folder it was granted.
      - name: Tests
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          cargo test --locked --workspace --no-fail-fast --
          --skip the_keyring_places_are_the_session_bus_and_the_keyring_folder
          --skip the_daemon_logs_its_links_changes_and_failed_calls
          --skip folder_mode_confines_commands_to_their_folders
          --skip windows_folder_grants_follow_the_folders
          --skip powershell_runs_in_an_appcontainer
          --skip powershell_changes_to_whole_paths_in_an_appcontainer
          --skip an_appcontainer_keeps_write_and_execute_apart_from_read
          --skip an_appcontainer_moves_only_what_it_reads_and_writes
          --skip a_cancel_ends_a_chain_of_processes_that_hand_over_and_exit
          --skip a_timeout_ends_a_grandchild_whose_parent_exited
