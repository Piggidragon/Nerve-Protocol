# The checks on every pull request, and on main after a merge: fmt, clippy and
# the tests on Linux, and clippy and the tests of the crates that have Windows
# code on Windows. The release workflow runs the same fmt, clippy and tests on
# Linux before it builds anything (docs/dev/releasing.md), but nothing there
# runs the Windows tests: its Windows job only builds.
#
# `pull_request` runs the merge of the branch into main, with a read-only token
# and no secrets, also for a pull request from a fork. Nothing here writes to
# the repository, and no secrets are used. The actions are pinned by commit.
#
# The cargo cache is saved by the runs on main as well, because a pull request
# can only read the caches of its own branch and of main: without them every
# new pull request would start cold.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request replaces its run that is still going. Runs on
# main are never cancelled: each commit there gets its result and its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The toolchain the release is built with (RUST_TOOLCHAIN in release.yml; raise
  # both together), so a pull request is checked the way the release is.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never
  # A CI run never builds twice, so incremental compilation only fills the cache.
  CARGO_INCREMENTAL: "0"
  # Line tables are enough for a backtrace, and the cache and the link step stay
  # small (the Windows PDBs most of all).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A test that fails on a machine nobody can reach says where.
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      # Before the cache, so a badly formatted pull request fails in seconds.
      - run: cargo fmt --check
      # The key holds the lock file and no restore key follows it: a changed
      # lock file builds once from scratch, and the cache never collects the
      # dependencies it once had.
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The whole workspace, with the end-to-end tests that start the real
      # programs (Unix only). `--no-fail-fast` shows every failing test at once.
      - run: cargo test --locked --workspace --no-fail-fast

  # nerve-node and nerve-policy are the crates with Windows-only code and tests
  # (grants, the integrity level, the service steps, Windows paths and rules).
  # Clippy covers the whole workspace, because Linux never compiles the
  # Windows branches of the other crates.
  windows:
    name: Windows (clippy, tests of nerve-node and nerve-policy)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked -p nerve-node -p nerve-policy --no-fail-fast
