[package]
name = "nerve-node-desktop"
description = "The Nerve node with its desktop app: the node, its CLI and a window that drives the CLI."
version.workspace = true
edition.workspace = true
repository.workspace = true
# Slint's own minimum.
rust-version = "1.92"
publish = false

[[bin]]
name = "nerve-node-desktop"
path = "src/main.rs"

[dependencies]
nerve-node.workspace = true
slint.workspace = true
serde_json.workspace = true

# Which list an audit button puts a sudo command on, and whether a target
# was cut: the node's own rules.
nerve-policy.workspace = true
# The name of the broker's pipe on Windows (src/broker.rs).
nerve-transport.workspace = true
# Native file and folder dialogs: the desktop portal on Linux, so they work
# on Wayland too.
rfd.workspace = true

[target.'cfg(windows)'.dependencies]
# The CLI takes the console of the terminal it was started from
# (src/console.rs); the broker is started with the UAC prompt and talks over
# a named pipe that only the app's user may open (src/broker.rs); the Start
# menu shortcut and the nerve:// handler (src/parts.rs); DLLs from System32
# only (src/main.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# Asks a node the app started to end, as Ctrl+C would (src/app/node.rs).
libc.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
nerve-conformance = { path = "../nerve-conformance" }
# Writes the screenshots of tests/shots.rs; in the lock through Slint.
png = "0.18"
